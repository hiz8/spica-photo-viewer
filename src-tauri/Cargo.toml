[package]
name = "spica-photo-viewer"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spica_photo_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# E2E-only: embeds a W3C WebDriver HTTP server in the app so @wdio/tauri-service
# can drive it with driverProvider: "embedded". Never compiled into a plain
# `cargo build --release` / `tauri build` — only `--features e2e` pulls it in.
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["unstable"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the formats the viewer supports (PROJECT_SPEC: JPEG/PNG/WebP/GIF).
# The defaults also pull avif (rav1e), exr, tiff, ... whose generic
# encoders/decoders get instantiated in this crate via `write_to` /
# `with_guessed_format`, inflating the final-crate LLVM pass.
image = { version = "0.25", default-features = false, features = ["rayon", "jpeg", "png", "webp", "gif"] }
base64 = "0.23"
walkdir = "2"
rayon = "1.12"
percent-encoding = "2"
tauri-plugin-wdio-webdriver = { version = "1.3", optional = true }
fast_image_resize = { version = "6.1", features = ["rayon"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.27"
tokio-test = "0.4"
tokio = { version = "1", features = ["macros", "rt"] }
filetime = "0.2.29"

