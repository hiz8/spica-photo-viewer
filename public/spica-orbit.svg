<style>
.orbit-spin,.orbit-counter{transform-box:view-box;transform-origin:0 0}
.orbit-spin{transform:rotate(150deg);animation:orbit-spin 4.01s linear infinite}
.orbit-counter{transform:rotate(-150deg);animation:orbit-counter 4.01s linear infinite}
.orbit-front{animation:orbit-front 4.01s step-end infinite}
@keyframes orbit-spin{from{transform:rotate(150deg)}to{transform:rotate(510deg)}}
@keyframes orbit-counter{from{transform:rotate(-150deg)}to{transform:rotate(-510deg)}}
@keyframes orbit-front{0%{opacity:1}8.3333%{opacity:0}58.3333%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.orbit-spin,.orbit-counter,.orbit-front{animation:none}}
</style>
